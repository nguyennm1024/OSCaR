<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF2E4"/>
      <stop offset="1" stop-color="#F0E1D0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF9F2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F8ECDE" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C65D1B"/>
      <stop offset="1" stop-color="#7C2D12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#A56A3A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#9A3412"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <circle cx="1320" cy="140" r="180" fill="#F3D5BC" opacity="0.7"/>
  <circle cx="220" cy="760" r="210" fill="#E7D9FF" opacity="0.48"/>

  <rect x="84" y="72" width="1432" height="756" rx="34" fill="#FFFFFF" fill-opacity="0.28" stroke="#D9C5B0"/>

  <!-- Top panel -->
  <g filter="url(#shadow)">
    <rect x="116" y="112" width="1368" height="206" rx="28" fill="url(#panel)" stroke="#D9C5B0"/>
  </g>
  <rect x="150" y="146" width="150" height="38" rx="19" fill="#F1D7BF"/>
  <text x="225" y="171" text-anchor="middle" fill="#7C2D12" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="1.5">NAACL 2024</text>
  <text x="150" y="240" fill="#1F1A17" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700">OSCaR</text>
  <text x="152" y="273" fill="#5E5044" font-family="Georgia, 'Times New Roman', serif" font-size="21">Object State Captioning and State Change Representation</text>
  <text x="152" y="299" fill="#5E5044" font-family="Georgia, 'Times New Roman', serif" font-size="21">for egocentric video</text>

  <!-- Top-right stats -->
  <g>
    <rect x="980" y="140" width="210" height="58" rx="16" fill="#FFF7ED" stroke="#D9C5B0"/>
    <text x="1085" y="176" text-anchor="middle" fill="#1F1A17" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">14,084 segments</text>
    <rect x="1210" y="140" width="244" height="58" rx="16" fill="#FFF7ED" stroke="#D9C5B0"/>
    <text x="1332" y="176" text-anchor="middle" fill="#1F1A17" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">500 benchmark videos</text>
    <rect x="980" y="216" width="210" height="58" rx="16" fill="#FFF7ED" stroke="#D9C5B0"/>
    <text x="1085" y="252" text-anchor="middle" fill="#1F1A17" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">28,308 entries</text>
    <rect x="1210" y="216" width="244" height="58" rx="16" fill="#FFF7ED" stroke="#D9C5B0"/>
    <text x="1332" y="252" text-anchor="middle" fill="#1F1A17" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">LLaVA 1.5 + Vicuna</text>
  </g>

  <!-- Three bottom panels -->
  <g filter="url(#shadow)">
    <rect x="116" y="364" width="340" height="380" rx="28" fill="url(#panel)" stroke="#D9C5B0"/>
    <rect x="496" y="364" width="560" height="380" rx="28" fill="url(#panel)" stroke="#D9C5B0"/>
    <rect x="1096" y="364" width="388" height="380" rx="28" fill="url(#panel)" stroke="#D9C5B0"/>
  </g>

  <!-- Column headers -->
  <text x="148" y="414" fill="#7C2D12" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">SOURCE DATASETS</text>
  <text x="528" y="414" fill="#7C2D12" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">OSCAR PIPELINE</text>
  <text x="1128" y="414" fill="#7C2D12" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">PUBLIC RELEASE</text>

  <!-- Source Datasets -->
  <rect x="148" y="444" width="276" height="104" rx="22" fill="#FFF8F0" stroke="#D9C5B0"/>
  <text x="178" y="481" fill="#1F1A17" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">EPIC-KITCHENS</text>
  <text x="178" y="515" fill="#5E5044" font-family="Arial, Helvetica, sans-serif" font-size="15">egocentric action data and</text>
  <text x="178" y="536" fill="#5E5044" font-family="Arial, Helvetica, sans-serif" font-size="15">human-verified benchmark split</text>

  <rect x="148" y="574" width="276" height="104" rx="22" fill="#FFF8F0" stroke="#D9C5B0"/>
  <text x="178" y="611" fill="#1F1A17" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">Ego4D</text>
  <text x="178" y="647" fill="#5E5044" font-family="Arial, Helvetica, sans-serif" font-size="15">open-world and additional</text>
  <text x="178" y="668" fill="#5E5044" font-family="Arial, Helvetica, sans-serif" font-size="15">state-change coverage</text>

  <!-- OSCaR Pipeline -->
  <rect x="528" y="444" width="496" height="80" rx="20" fill="#FFF8F0" stroke="#D9C5B0"/>
  <text x="558" y="491" fill="#1F1A17" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Frame composites + state-change captions</text>
  <rect x="528" y="542" width="496" height="80" rx="20" fill="#FFF8F0" stroke="#D9C5B0"/>
  <text x="558" y="589" fill="#1F1A17" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">LLaVA fine-tuning manifests and eval splits</text>
  <rect x="528" y="640" width="496" height="80" rx="20" fill="url(#accent)"/>
  <text x="558" y="687" fill="#FFF8F0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">LoRA adapters + projector checkpoints</text>

  <!-- Public Release -->
  <rect x="1128" y="444" width="324" height="84" rx="22" fill="#FFF8F0" stroke="#D9C5B0"/>
  <text x="1158" y="480" fill="#1F1A17" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">GitHub code</text>
  <text x="1158" y="510" fill="#5E5044" font-family="Arial, Helvetica, sans-serif" font-size="15">train, infer, eval, data prep, docs</text>

  <rect x="1128" y="544" width="324" height="84" rx="22" fill="#FFF8F0" stroke="#D9C5B0"/>
  <text x="1158" y="580" fill="#1F1A17" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">HF dataset</text>
  <text x="1158" y="610" fill="#5E5044" font-family="Arial, Helvetica, sans-serif" font-size="15">assets, manifests, metadata, splits</text>

  <rect x="1128" y="644" width="324" height="84" rx="22" fill="#FFF8F0" stroke="#D9C5B0"/>
  <text x="1158" y="680" fill="#1F1A17" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">HF models</text>
  <text x="1158" y="710" fill="#5E5044" font-family="Arial, Helvetica, sans-serif" font-size="15">7B / 13B adapters and projectors</text>

  <!-- Connector arrows (between columns) -->
  <path d="M461 554H484" stroke="#9A3412" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1061 554H1084" stroke="#9A3412" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Footer text -->
  <text x="800" y="800" text-anchor="middle" fill="#5E5044" font-family="Arial, Helvetica, sans-serif" font-size="18">
    Accepted NAACL paper, code, dataset, and model release for object state captioning in egocentric video
  </text>
</svg>
